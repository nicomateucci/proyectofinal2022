<div class="menu-burger-container">
    <button class="text-light h3" mat-button routerLink="/home">FinanSys</button>   

    <div class="menu-toggle" (click)="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>
    
    <div class="nav-list" *ngIf="isMenuOpen">
        <button class="text-light" mat-button routerLink="/courses" (click)="closeMenuClick($event)">Cursos</button>
        <button class="text-light" mat-button [matMenuTriggerFor]="assets"> Activos </button>
        <mat-menu #assets="matMenu">
            <button mat-menu-item routerLink="/assets" (click)="closeMenuClick($event)">Activos 1</button>
            <button mat-menu-item routerLink="/assets" (click)="closeMenuClick($event)">Activos 2</button>
            <button mat-menu-item routerLink="/assets" (click)="closeMenuClick($event)">Activos 3</button>
        </mat-menu>
    
        @if (checkCurrentUser()) {
            <button class="text-light" mat-button routerLink="/myCourses" (click)="closeMenuClick($event)">Mis cursos</button>
            <button class="text-light" mat-button (click)="closeMenuClick($event)">Mis Activos</button>
        }
 
        @if (!checkCurrentUser()) {
            <button class="btn btn-outline-success m-1" (click)="loginUser()" (click)="closeMenuClick($event)">Iniciar Sesion</button>
        }@else {
            <button type="button" class="btn btn-outline-primary m-1" routerLink="/profile" (click)="closeMenuClick($event)">Perfil</button>
            <button class="btn btn-outline-success m-1" (click)="logoutUser()" (click)="closeMenuClick($event)">Cerrar Sesion</button>
        }
    </div>
</div>
