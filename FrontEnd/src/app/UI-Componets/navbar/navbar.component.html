<mat-toolbar class="navbar" style="height: 64px;" [ngClass]="{'fixed-top': isFixed}">
  <div class="not-menu-burger">
    <button class="text-light h3" mat-button routerLink="/home">FinanSys</button>
    
    <button class="text-light" mat-button routerLink="/courses" >Cursos</button>

    <button class="text-light" mat-button [matMenuTriggerFor]="assets"> Activos </button>
    <mat-menu #assets="matMenu">
      <button mat-menu-item routerLink="/assets">Activos 1</button>
      <button mat-menu-item routerLink="/assets">Activos 2</button>
      <button mat-menu-item routerLink="/assets">Activos 3</button>
    </mat-menu>

    <ng-container *ngIf="authService.isAuthenticated$ | async">
      <button class="text-light" mat-button routerLink="/myCourses">Mis cursos</button>
      <button class="text-light" mat-button>Mis Activos</button>
    </ng-container>

    <span style="flex: 1 1 auto;"></span>

    <ng-container *ngIf="authService.isAuthenticated$ | async; else loggedOut">
      <button type="button" class="btn btn-outline-primary m-1" routerLink="/profile">Perfil</button>
      <button class="btn btn-outline-success m-1" (click)="logoutUser()">Cerrar Sesion </button>
    </ng-container>
    <ng-template #loggedOut>
      <button type="button" class="btn btn-outline-success m-1" (click)="loginUser()">Iniciar Sesion</button>
    </ng-template>

  </div>

  <app-menu-burger class="w-100"></app-menu-burger>
</mat-toolbar>
